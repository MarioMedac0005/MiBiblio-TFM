<aside
  class="fixed top-0 left-0 w-full md:h-screen bg-surface md:border-r border-border flex flex-col z-50 overflow-hidden transition-all duration-300 ease-in-out"
  [class.md:w-64]="!collapsed()"
  [class.md:w-[72px]]="collapsed()"
  [class.max-md:border-b]="true"
  [class.h-[73px]]="!mobileOpen()"
  [class.max-md:h-screen]="mobileOpen()"
>
  <div class="flex items-center justify-between px-5 py-6 border-b border-border min-h-[73px]" [class.md:justify-center]="collapsed()" [class.md:px-0]="collapsed()">
    <div class="flex items-center gap-3.5" [class.md:gap-0]="collapsed()">
      <div class="flex items-center justify-center w-9 h-9 bg-linear-to-br from-primary-500 to-primary-700 rounded-[10px] text-white shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
        </svg>
      </div>
      <span
        class="text-lg font-bold text-text-primary tracking-tight whitespace-nowrap transition-all duration-300 overflow-hidden"
        [class.w-0]="collapsed()"
        [class.w-auto]="!collapsed()"
        [class.md:opacity-0]="collapsed()"
      >MiBiblio</span>
    </div>
    
    <button class="md:hidden p-2 text-text-secondary hover:text-primary-600 focus:outline-none" (click)="mobileOpen.set(!mobileOpen())">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
        @if (!mobileOpen()) {
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        } @else {
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        }
      </svg>
    </button>
  </div>

  <nav class="flex-1 p-3 flex flex-col gap-1 overflow-y-auto overflow-x-hidden">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="!bg-primary-50 !text-primary-600 !font-semibold"
        (click)="mobileOpen.set(false)"
        [title]="item.label"
        class="flex items-center gap-3.5 px-3.5 py-3 rounded-lg text-text-secondary text-sm font-medium no-underline whitespace-nowrap relative transition-all duration-200 hover:bg-primary-50 hover:text-primary-600"
        [class.md:justify-center]="collapsed()"
        [class.md:px-3]="collapsed()"
        [class.md:gap-0]="collapsed()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-[22px] h-[22px] shrink-0">
          <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
        </svg>
        <span
          class="transition-all duration-300 overflow-hidden"
          [class.w-0]="collapsed()"
          [class.w-auto]="!collapsed()"
          [class.md:opacity-0]="collapsed()"
        >{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="p-3 border-t border-border">
    <button
      (click)="logout()"
      class="flex w-full items-center gap-3.5 px-3.5 py-3 rounded-lg text-red-600 text-sm font-medium no-underline whitespace-nowrap relative transition-all duration-200 hover:bg-red-50"
      [class.md:justify-center]="collapsed()"
      [class.md:px-3]="collapsed()"
      [class.md:gap-0]="collapsed()"
      title="Cerrar sesión"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-[22px] h-[22px] shrink-0">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
      </svg>
      <span
        class="transition-all duration-300 overflow-hidden"
        [class.w-0]="collapsed()"
        [class.w-auto]="!collapsed()"
        [class.md:opacity-0]="collapsed()"
      >Cerrar Sesión</span>
    </button>
  </div>

  <button
    (click)="toggleSidebar()"
    [title]="collapsed() ? 'Expandir' : 'Colapsar'"
    class="hidden md:flex items-center justify-center p-4 border-t border-border bg-transparent text-text-muted cursor-pointer transition-colors duration-200 hover:text-primary-600"
  >
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 transition-transform duration-300"
      [class.rotate-180]="collapsed()">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
    </svg>
  </button>
</aside>
